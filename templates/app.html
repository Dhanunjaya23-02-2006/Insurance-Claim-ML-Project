<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Claim Prediction</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 300px;">
        <h2 style="text-align: center; color: #333;">Insurance Claim Prediction</h2>
        <form action="/" method="POST" style="display: flex; flex-direction: column;">
            <label for="policy_type" style="margin-bottom: 5px; font-weight: bold;">Policy Type:</label>
            <input type="number" step="any" name="policy_type" required style="padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
            
            <label for="accident_severity" style="margin-bottom: 5px; font-weight: bold;">Accident Severity:</label>
            <input type="number" step="any" name="accident_severity" required style="padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
            
            <label for="driving_record" style="margin-bottom: 5px; font-weight: bold;">Driving Record:</label>
            <input type="number" step="any" name="driving_record" required style="padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
            
            <button type="submit" style="background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                Predict
            </button>
        </form>

        {% if prediction %}
        <div style="margin-top: 15px; padding: 10px; background: #dff0d8; border-radius: 5px; text-align: center; color: #155724; font-weight: bold;">
            Prediction: {{ prediction }}
        </div>
        {% endif %}
    </div>
</body>
</html>
